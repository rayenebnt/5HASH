# Run every command from the repository root: this file configures the paths
# used by ansible-galaxy, ansible-inventory and ansible-playbook.
[defaults]
inventory            = ansible/inventory.yml
roles_path           = ansible/galaxy_roles:ansible/roles
collections_path     = ansible/collections
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = auto_silent
stdout_callback      = yaml
display_skipped_hosts = False
callbacks_enabled    = ansible.posix.profile_tasks
forks                = 10

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ConnectTimeout=20
