---
- name: Install the MySQL client used by the schema checks
  ansible.builtin.apt:
    name: "{{ prestashop_mysql_client_package }}"
    state: present

- name: Create the configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ prestashop_config_dir }}"
    - "{{ prestashop_php_conf_dir }}"

# The database password never transits through the control node and is never
# written in the repository: the instance reads it from Secrets Manager with its
# own IAM role, and the file it writes is only readable by root.
- name: Install the credentials helper
  ansible.builtin.template:
    src: ts-db-credentials.py.j2
    dest: /usr/local/bin/ts-db-credentials
    owner: root
    group: root
    mode: "0750"

- name: Install the database helper
  ansible.builtin.template:
    src: ts-db.sh.j2
    dest: /usr/local/bin/ts-db
    owner: root
    group: root
    mode: "0750"

- name: Fetch the database credentials from Secrets Manager
  ansible.builtin.command:
    cmd: /usr/local/bin/ts-db-credentials
  register: prestashop_credentials
  # Exact match, not `in`: "changed" is a substring of the negative answer.
  changed_when: (prestashop_credentials.stdout | default('') | trim) == "changed"
  notify: Restart PrestaShop

- name: Install the PHP configuration of the shop
  ansible.builtin.template:
    src: zz-taylorshift.ini.j2
    dest: "{{ prestashop_php_conf_dir }}/zz-taylorshift.ini"
    owner: root
    group: root
    mode: "0644"
  notify: Restart PrestaShop

- name: Create the local cache directory
  ansible.builtin.file:
    path: "{{ prestashop_cache_dir }}"
    state: directory
    owner: "{{ prestashop_www_uid }}"
    group: "{{ prestashop_www_gid }}"
    mode: "0755"

# The document root must stay empty until the installer has run: the image only
# unpacks PrestaShop into a directory it finds empty.
#
# On shared storage one instance creates the directories for everyone; without
# it, each instance owns its copy - hence the two tasks rather than a templated
# run_once, which would silently skip the other hosts.
- name: Create the shared document root and session directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ prestashop_www_uid }}"
    group: "{{ prestashop_www_gid }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ prestashop_html_dir }}", mode: "0755"}
    - {path: "{{ prestashop_sessions_dir }}", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"
  run_once: true
  when: prestashop_shared_storage | bool

- name: Create the local document root and session directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ prestashop_www_uid }}"
    group: "{{ prestashop_www_gid }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ prestashop_html_dir }}", mode: "0755"}
    - {path: "{{ prestashop_sessions_dir }}", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"
  when: not (prestashop_shared_storage | bool)
