---
# Restarting through the CLI keeps the container specification in one place
# (tasks/deploy.yml) and makes the handler a no-op on the first run, when the
# container does not exist yet and is about to be created with the new
# configuration anyway.
- name: Restart PrestaShop
  ansible.builtin.command:
    cmd: "docker restart {{ prestashop_container_name }}"
  register: prestashop_restart
  changed_when: prestashop_restart.rc == 0
  failed_when:
    - prestashop_restart.rc != 0
    - "'No such container' not in prestashop_restart.stderr"
  listen: Restart PrestaShop

# PrestaShop compiles its configuration - including the shop URL - into
# var/cache, which lives on each instance's own disk. The contents go, not the
# directory itself: it is a bind mount, and removing it would break the mount
# under the running container.
- name: Clear the PrestaShop cache
  ansible.builtin.command:
    cmd: "find {{ prestashop_cache_dir }} -mindepth 1 -maxdepth 1 -exec rm -rf {} +"
  changed_when: true
  listen: Clear the PrestaShop cache
